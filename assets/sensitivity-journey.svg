<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-label="How sensitivity changed during training, including the drop from 95 percent to 64 percent on fresh cases">
<rect width="1000" height="580" fill="#ffffff"/>
<text x="50" y="42" font-size="26" font-weight="700" fill="#111111" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">How sensitive cases caught changed</text>
<text x="50" y="68" font-size="15" fill="#666666" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">% of sensitive cases sent to the right, safest place. Target was 98% — never reached.</text>
<line x1="70" y1="77.6" x2="950" y2="77.6" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="950" y="69.6" font-size="13" fill="#111111" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Target: 98%</text>
<line x1="70" y1="450.0" x2="950" y2="450.0" stroke="#e5e5e5" stroke-width="1"/><text x="58" y="455.0" font-size="13" fill="#666666" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">0%</text><line x1="70" y1="355.0" x2="950" y2="355.0" stroke="#e5e5e5" stroke-width="1"/><text x="58" y="360.0" font-size="13" fill="#666666" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">25%</text><line x1="70" y1="260.0" x2="950" y2="260.0" stroke="#e5e5e5" stroke-width="1"/><text x="58" y="265.0" font-size="13" fill="#666666" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">50%</text><line x1="70" y1="165.0" x2="950" y2="165.0" stroke="#e5e5e5" stroke-width="1"/><text x="58" y="170.0" font-size="13" fill="#666666" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">75%</text><line x1="70" y1="70.0" x2="950" y2="70.0" stroke="#e5e5e5" stroke-width="1"/><text x="58" y="75.0" font-size="13" fill="#666666" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">100%</text>
<polyline points="70.0,336.0 195.7,193.5 321.4,117.5 447.1,108.0 572.9,89.0 698.6,208.3 824.3,121.7 950.0,108.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="70.0" cy="336.0" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="70.0" y="320.0" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">30%</text><circle cx="195.7" cy="193.5" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="195.7" y="177.5" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">67.5%</text><circle cx="321.4" cy="117.5" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="321.4" y="101.5" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">87.5%</text><circle cx="447.1" cy="108.0" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="447.1" y="92.0" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">90%</text><circle cx="572.9" cy="89.0" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="572.9" y="73.0" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">95%</text><circle cx="698.6" cy="208.3" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="698.6" y="192.3" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">63.6%</text><circle cx="824.3" cy="121.7" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="824.3" y="105.7" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">86.4%</text><circle cx="950.0" cy="108.0" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="950.0" y="92.0" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">90%</text>
<text x="70.0" y="478" font-size="13" fill="#333333" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Start</text><text x="195.7" y="478" font-size="13" fill="#333333" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Reworded</text><text x="321.4" y="478" font-size="13" fill="#333333" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">First training</text><text x="447.1" y="478" font-size="13" fill="#333333" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Varied wording</text><text x="572.9" y="478" font-size="13" fill="#333333" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Old test peak</text><text x="698.6" y="478" font-size="13" fill="#333333" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Fresh cases</text><text x="824.3" y="478" font-size="13" fill="#333333" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Broader vocabulary</text><text x="950.0" y="478" font-size="13" fill="#333333" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Final holdout</text>
<text x="50" y="520" font-size="14" font-weight="700" fill="#111111" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The honest drop: 95% → 64% on brand-new cases.</text>
<text x="50" y="544" font-size="14" fill="#666666" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The model had learned my wording, not the idea. Test sets differ — see training-journey.md.</text>
</svg>
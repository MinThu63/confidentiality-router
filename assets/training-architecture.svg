<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" role="img" aria-label="How I trained it: architecture at run time and the training loop">
<rect width="1000" height="1020" fill="#ffffff"/>
<text x="50" y="48" font-size="28" font-weight="700" fill="#111111" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">How I trained it</text>
<text x="50" y="78" font-size="16" fill="#666666" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">At run time (top): the frozen base model picks an option. Training (bottom): only the small adapter is trained.</text>

<!-- Run-time flow: vertical stack -->
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="50" y="100" width="900" height="76" rx="12" fill="#f3f4f6" stroke="#111111" stroke-width="2"/>
  <text x="70" y="130" font-size="17" font-weight="700" fill="#111111">1 · Request + list of options</text>
  <text x="70" y="156" font-size="15" fill="#333333">e.g. “Summarise this draft…” — with Local / Private / Public to choose from</text>

  <text x="490" y="202" font-size="22" font-weight="700" fill="#2563eb" text-anchor="middle">↓</text>

  <rect x="50" y="210" width="900" height="76" rx="12" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="70" y="240" font-size="17" font-weight="700" fill="#111111">2 · Qwen3.5-2B Base — frozen, 4.3 GB</text>
  <text x="70" y="266" font-size="15" fill="#333333">The big model. I did not retrain it — it stays frozen.</text>

  <text x="490" y="312" font-size="22" font-weight="700" fill="#2563eb" text-anchor="middle">↓</text>

  <rect x="50" y="320" width="900" height="76" rx="12" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="70" y="350" font-size="17" font-weight="700" fill="#111111">3 · Pointer head — picks the best option</text>
  <text x="70" y="376" font-size="15" fill="#333333">It points at an option from the list. It does not write text.</text>

  <text x="490" y="422" font-size="22" font-weight="700" fill="#2563eb" text-anchor="middle">↓</text>

  <rect x="50" y="430" width="900" height="76" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="460" font-size="17" font-weight="700" fill="#ffffff">4 · LoRA adapter — rank 48, 202 MB</text>
  <text x="70" y="486" font-size="15" fill="#dbeafe">The only part I trained. A small add-on on top of the frozen base.</text>

  <text x="490" y="532" font-size="22" font-weight="700" fill="#2563eb" text-anchor="middle">↓</text>

  <rect x="50" y="540" width="900" height="76" rx="12" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="70" y="570" font-size="17" font-weight="700" fill="#111111">5 · Two questions</text>
  <text x="70" y="596" font-size="15" fill="#333333">1) Must this stay inside the company?  2) If not, which of the 3 places fits best?</text>

  <text x="490" y="642" font-size="22" font-weight="700" fill="#2563eb" text-anchor="middle">↓</text>

  <rect x="50" y="650" width="900" height="76" rx="12" fill="#111111" stroke="#111111" stroke-width="2"/>
  <text x="70" y="680" font-size="17" font-weight="700" fill="#ffffff">Destination — Own computer / Own cloud / Outside API</text>
  <text x="70" y="706" font-size="15" fill="#d1d5db">Local, private, or public — about 116 milliseconds per request.</text>
</g>

<!-- Training loop -->
<text x="50" y="782" font-size="22" font-weight="700" fill="#111111" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">How it was trained</text>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="50" y="800" width="210" height="160" rx="12" fill="#f3f4f6" stroke="#111111" stroke-width="2"/>
  <text x="66" y="830" font-size="15" font-weight="700" fill="#2563eb">DATA</text>
  <text x="66" y="858" font-size="15" font-weight="700" fill="#111111">Matched pairs</text>
  <text x="66" y="882" font-size="14" fill="#333333">~3,900 rows,</text>
  <text x="66" y="904" font-size="14" fill="#333333">8 departments,</text>
  <text x="66" y="926" font-size="14" fill="#333333">sensitive vs harmless</text>

  <text x="268" y="885" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">→</text>

  <rect x="288" y="800" width="210" height="160" rx="12" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="304" y="830" font-size="15" font-weight="700" fill="#2563eb">TRAIN</text>
  <text x="304" y="858" font-size="15" font-weight="700" fill="#111111">Adapter only</text>
  <text x="304" y="882" font-size="14" fill="#333333">13 numbered runs,</text>
  <text x="304" y="904" font-size="14" fill="#333333">failures kept</text>
  <text x="304" y="926" font-size="14" fill="#333333">in the log</text>

  <text x="506" y="885" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">→</text>

  <rect x="526" y="800" width="210" height="160" rx="12" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="542" y="830" font-size="15" font-weight="700" fill="#2563eb">CALIBRATE</text>
  <text x="542" y="858" font-size="15" font-weight="700" fill="#111111">Fit confidence</text>
  <text x="542" y="882" font-size="14" fill="#333333">Turn raw scores</text>
  <text x="542" y="904" font-size="14" fill="#333333">into honest</text>
  <text x="542" y="926" font-size="14" fill="#333333">confidence</text>

  <text x="744" y="885" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">→</text>

  <rect x="764" y="800" width="186" height="160" rx="12" fill="#111111" stroke="#111111" stroke-width="2"/>
  <text x="780" y="830" font-size="15" font-weight="700" fill="#2563eb">TEST</text>
  <text x="780" y="858" font-size="15" font-weight="700" fill="#ffffff">Frozen holdout</text>
  <text x="780" y="882" font-size="14" fill="#d1d5db">80 cases, written</text>
  <text x="780" y="904" font-size="14" fill="#d1d5db">after the model</text>
  <text x="780" y="926" font-size="14" fill="#d1d5db">was frozen</text>
</g>
<text x="50" y="998" font-size="14" fill="#666666" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Base model: Qwen3.5-2B-Base, used through Strands Decider 2B. One 8 GB laptop graphics card, about 4.5 GB used.</text>
</svg>
